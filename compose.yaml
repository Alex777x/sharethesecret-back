services:
  backend:
    build: ./backend
    container_name: secretnote-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
    depends_on:
      - redis

  frontend:
    build: ./frontend
    container_name: secretnote-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  redis:
    image: redis:latest
    container_name: secretnote-redis
    ports:
      - "6379:6379"
    restart: always
